[package]
name = "gba-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Strawberry, the desktop player for gba-core: library, window, audio, input, bench (pure Rust: minifb + cpal + gilrs)."

[[bin]]
name = "strawberry"
path = "src/main.rs"

[dependencies]
gba-core = { path = "../gba-core", features = ["savestate"] }
gba-test = { path = "../gba-test" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minifb = "0.28"
cpal = "0.15"
gilrs = "0.11"
tiny-skia = "0.11"
fontdue = "0.9"
dirs = "6"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
png = "0.17"
chrono = "0.4"
raw-window-handle = "0.6"

[dev-dependencies]
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
