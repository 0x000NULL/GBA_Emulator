[workspace]
resolver = "3"
members = ["gba-core", "gba-frontend", "gba-test"]

[workspace.package]
version = "1.6.1"
edition = "2024"
license = "MIT"
authors = ["Ethan Aldrich"]

[profile.dev]
opt-level = 1

[profile.dev.package.gba-core]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

# Shipped binaries (the release workflow builds with `--profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false
