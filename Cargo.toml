[workspace]
resolver = "2"
members = ["gba-core", "gba-frontend", "gba-test"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ethan Aldrich"]

[profile.dev]
opt-level = 1

[profile.dev.package.gba-core]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
