# Mario Tennis: Power Tour (USA): language select (A, LEFT to "Yes", A) -> health warning (any
# button) -> START skips the attract intro, START on the title -> story character select: A picks
# Clay, A confirms "Pick a character", A answers "Play as the boy? Yes" (~5500) -> A picks Righty,
# A confirms (~6800) -> A picks Normal difficulty, A confirms (~8200) -> "Change the name?" defaults
# to Yes, RIGHT moves it to No, A (~9100) -> "Is 'Clay' OK? Yes" A (~9600) -> dorm-room intro
# dialogue on A taps every 200-400 frames -> control at the dorm plaza (~21000) -> DOWN to
# "Outside Restaurant", RIGHT 160 frames to the door, UP triggers "Nice work! We're here." ->
# restaurant dialogue on A taps (masked players have challenged the academy; Ace goes ahead to the
# center court, control returns ~26700) -> DOWN leaves the restaurant (28810-29200).
# Added route (branches from tennis-match.toml at 29260): RIGHT 340 frames (29260-29600) stops
# between the two lanes with lanterns, DOWN takes the southern path off "Outside Restaurant"
# (the way to the center court) and triggers the center-court aftermath cutscene ("Alex lost!
# That's insane! Who is that masked man?", ~30300) -> A taps every 200 frames through the
# crowd/partner/journalist dialogue (one "Yes" answered by the default) -> "To the headmaster's
# office, and pronto!" -> control in "Tennis Academy Plaza" (~38900). UP from the plaza is
# blocked ("The headmaster's office is in the main building"); LEFT is the varsity court ("No
# one's here right now"); DOWN crosses the bridge into "Tennis Academy Main Building" (lobby,
# ~39350). The headmaster's office trigger was NOT found yet: the 1F lower hall (old man: "What
# rude fellows!"), both 1F wings, the right counter ledge, the 2F balcony (trophy room, an empty
# office with sofas and a desk) were explored without an event. The first match is not reached.
