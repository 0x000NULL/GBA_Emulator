# letter under the cursor (it starts on "A"), UP wraps the cursor to the bottom row, LEFT wraps it to
# the OK key, A confirms, A again answers the "Is ... correct?" prompt. A x8 from 3200 pages the
# greeting; name "A" (4300-4600, confirmed 4900); birth month JAN (5300-5700); the face picker and
# hobby "AA" (6100-9100, confirmed 9500); comment "A" (9900-11000, confirmed 11400); passport OK
