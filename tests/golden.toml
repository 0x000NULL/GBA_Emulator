# Golden test manifest. Paths resolve against GBA_TESTS_DIR (populated by scripts/fetch-tests.ps1),
# then the repo root. `golden` hashes are xxh3-64 of the 240x160 BGR555 framebuffer after `frames`.
# Record a hash with: cargo run -p gba-test -- <rom> --frames N --record   (review the --png first).

[defaults]
hash = "xxh3-64"
frames = 16
bios = "hle"

# ---------------------------------------------------------------- jsmolka/gba-tests: M1 CPU gate
[[rom]]
path = "gba-tests/arm/arm.gba"
check = "jsmolka"
frames = 32

[[rom]]
path = "gba-tests/thumb/thumb.gba"
check = "jsmolka"
frames = 32

# ---------------------------------------------------------------- jsmolka: M2 system gate
[[rom]]
path = "gba-tests/memory/memory.gba"
check = "jsmolka"
frames = 32

[[rom]]
path = "gba-tests/bios/bios.gba"
check = "jsmolka"
frames = 32

[[rom]]
path = "gba-tests/nes/nes.gba"
check = "jsmolka"
frames = 32

# ---------------------------------------------------------------- jsmolka: M3 PPU gate (visual only)
[[rom]]
path = "gba-tests/ppu/hello.gba"
frames = 8
golden = "5cee00b5da5687af"

[[rom]]
path = "gba-tests/ppu/shades.gba"
frames = 8
golden = "6562064cc0a429d6"

[[rom]]
path = "gba-tests/ppu/stripes.gba"
frames = 8
golden = "16a1044e534ad1b0"

# ---------------------------------------------------------------- jsmolka: M5 save gate
[[rom]]
path = "gba-tests/save/none.gba"
check = "jsmolka"
frames = 32

[[rom]]
path = "gba-tests/save/sram.gba"
check = "jsmolka"
frames = 32

[[rom]]
path = "gba-tests/save/flash64.gba"
check = "jsmolka"
frames = 400

[[rom]]
path = "gba-tests/save/flash128.gba"
check = "jsmolka"
frames = 400

# ---------------------------------------------------------------- mgba-emu/suite
# suite.gba is built from tools/tests/suite by scripts/fetch-tests.ps1 (devkitpro/devkitarm Docker image).
# One entry per menu item; the input script navigates DOWN x N then A. `expect` is the hardware-verified
# pass count we currently reach: a full pass where the suite is deterministic (shifter, carry, multiply
# long, BIOS math), otherwise a regression floor that is raised as fixes land (see PROGRESS.md).

[[rom]]
path = "suite/suite.gba"
check = "mgba-suite"
frames = 1800
input_file = "tests/inputs/suite/suite-00-memory.toml"
expect = "1552/1552"
note = "Memory tests"

[[rom]]
path = "suite/suite.gba"
check = "mgba-suite"
frames = 600
input_file = "tests/inputs/suite/suite-01-io-read.toml"
expect = "130/130"
note = "I/O read tests"

